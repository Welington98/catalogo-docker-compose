version: "3"

networks:
  n8n:
    driver: bridge

services:
  traefik:
    image: "traefik"
    restart: always
    networks: 
      - n8n
    command:
      - "--api=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DATA_FOLDER}/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  n8n_editor:
    image: n8nio/n8n:latest
    restart: always
    networks: 
      - n8n    
    ports:
      - "5678:5678"
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n_editor.rule=Host(`n8n.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n_editor.service=n8n_editor
      - traefik.http.routers.n8n_editor.tls=true
      - traefik.http.routers.n8n_editor.entrypoints=web,websecure
      - traefik.http.routers.n8n_editor.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n_editor.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n_editor.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n_editor.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n_editor.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n_editor.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n_editor.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n_editor.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n_editor.headers.STSPreload=true
      - traefik.http.routers.n8n_editor.middlewares=n8n@docker
      - traefik.http.services.n8n_editor.loadbalancer.server.port=5678
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER
      - N8N_BASIC_AUTH_PASSWORD
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_EDITOR_BASE_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # URL Webhook
      - WEBHOOK_URL=https://webhook.${DOMAIN_NAME}/
      # Modo execução para fila
      - EXECUTIONS_MODE=queue
      # redis
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=Pg&123
      - QUEUE_BULL_REDIS_DB=0
      - NODE_FUNCTION_ALLOW_EXTERNAL=moment,lodash,moment-with-locales
      - EXECUTIONS_DATA_PRUNE='true'
      - EXECUTIONS_DATA_MAX_AGE=336
      # Banco de dados
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=postgree_n8n
      - DB_POSTGRESDB_HOST=postgree
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_SCHEMA=public
      - DB_POSTGRESDB_PASSWORD=Pg&123
    deploy:
      replicas: 1
      mode: replicated
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '0.3'
          memory: 512M
    volumes:
      - ${DATA_FOLDER}/.n8n:/home/node/.n8n

  n8n_webhook:
    image: n8nio/n8n:latest
    command: webhook
    restart: always
    networks: 
      - n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER
      - N8N_BASIC_AUTH_PASSWORD
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_EDITOR_BASE_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # URL Webhook
      - WEBHOOK_URL=https://webhook.${DOMAIN_NAME}/
      # Modo execução para fila
      - EXECUTIONS_MODE=queue
      # redis
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=Pg&123
      - QUEUE_BULL_REDIS_DB=0
      - NODE_FUNCTION_ALLOW_EXTERNAL=moment,lodash,moment-with-locales
      - EXECUTIONS_DATA_PRUNE='true'
      - EXECUTIONS_DATA_MAX_AGE=336
      # Banco de dados
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=postgree_n8n
      - DB_POSTGRESDB_HOST=postgree
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_SCHEMA=public
      - DB_POSTGRESDB_PASSWORD=Pg&123
    deploy:
      replicas: 1
      mode: replicated
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '0.5'
          memory: 320M
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n_webhook.rule=Host(`webhook.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n_webhook.service=n8n_webook
      - traefik.http.routers.n8n_webhook.tls=true
      - traefik.http.routers.n8n_webhook.entrypoints=web,websecure
      - traefik.http.routers.n8n_webhook.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n_webhook.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n_webhook.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n_webhook.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n_webhook.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n_webhook.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n_webhook.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n_webhook.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n_webhook.headers.STSPreload=true
      - traefik.http.routers.n8n_webhook.middlewares=n8n@docker
      - traefik.http.services.n8n_webhook.loadbalancer.server.port=5678
    volumes:
      - ${DATA_FOLDER}/.n8n:/home/node/.n8n

  n8n_worker:
    image: n8nio/n8n:latest
    command: webhook --concurrency=3
    restart: always
    networks: 
      - n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER
      - N8N_BASIC_AUTH_PASSWORD
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_EDITOR_BASE_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # URL Webhook
      - WEBHOOK_URL=https://webhook.${DOMAIN_NAME}/
      # Modo execução para fila
      - EXECUTIONS_MODE=queue
      # redis
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=Pg&123
      - QUEUE_BULL_REDIS_DB=0
      - NODE_FUNCTION_ALLOW_EXTERNAL=moment,lodash,moment-with-locales
      - EXECUTIONS_DATA_PRUNE='true'
      - EXECUTIONS_DATA_MAX_AGE=336
      # Banco de dados
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=postgree_n8n
      - DB_POSTGRESDB_HOST=postgree
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_SCHEMA=public
      - DB_POSTGRESDB_PASSWORD=Pg&123
    deploy:
      replicas: 1
      mode: replicated
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '0.5'
          memory: 320M
    volumes:
      - ${DATA_FOLDER}/.n8n:/home/node/.n8n

  postgree_n8n:
    image: postgres:latest
    ports: 
      - "5432:5432"
    networks: 
      - n8n
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: Pg&123
      POSTGRES_DB: n8n

  postgree_dados:
    image: postgres:latest
    ports: 
      - "5432:5432"
    networks: 
      - n8n
    environment:
      POSTGRES_USER: dados
      POSTGRES_PASSWORD: Pg&123
      POSTGRES_DB: dados

  pgAdmin:
    image: dpage/pgadmin4
    ports: 
      - "8080:80"
    networks: 
      - n8n
    environment: 
      PGADMIN_DEFAULT_EMAIL: fabricio@veronez.dev
      PGADMIN_DEFAULT_PASSWORD: PgAdmin@123